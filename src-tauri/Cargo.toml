[package]
name = "zeeboard"
version = "0.2.0"
description = "ZeeBoard: commission manager for artists"
authors = ["AverageZebraBoy"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zeeboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2.7.1"

# Procesado de imágenes: decodificar, redimensionar (SIMD) y comprimir a WebP
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
fast_image_resize = "5"
webp = "0.3"
sha2 = "0.10"
tauri-plugin-notification = "2.2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

# Receives images from the iPad (small blocking HTTP server) and finds this PC's addresses
tiny_http = "0.12"
if-addrs = "0.13"

# En modo desarrollo, las dependencias se compilan optimizadas: procesar un lienzo
# enorme sin optimizar tardaría decenas de segundos
[profile.dev.package."*"]
opt-level = 3

