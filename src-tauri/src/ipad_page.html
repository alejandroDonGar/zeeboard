<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZeeBoard">
<title>ZeeBoard</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f3ee; --card: #fff; --ink: #1f2933; --muted: #5f5649; --line: #e6ded2; --primary: #1f2933; --on: #fff; --ok: #1d7a4a; --bad: #b83228; --glass: rgba(255,252,246,.82); --g1: #e4b98a55; --g2: #9fc3d455; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16181c; --card: #1f2227; --ink: #ece6dc; --muted: #b8b0a3; --line: #33373e; --primary: #ece6dc; --on: #1f2933; --ok: #5ec48d; --bad: #ef7b73; --glass: rgba(34,37,42,.82); --g1: #5a3a2299; --g2: #223a4a99; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse 60% 40% at 80% 5%, var(--g1), transparent), radial-gradient(ellipse 50% 35% at 5% 95%, var(--g2), transparent), var(--bg); color: var(--ink); font: 17px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); }
  main { max-width: 560px; margin: 0 auto; padding-top: 20px; }
  h1 { font-size: 28px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; margin: 0 0 4px; }
  h2 { font-size: 15px; font-weight: 700; color: var(--muted); margin: 24px 0 10px; }
  p { margin: 0; color: var(--muted); }
  .item, .btn { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--glass); color: var(--ink); border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; font: inherit; }
  .item b { display: block; }
  .item span { color: var(--muted); font-size: 15px; }
  .btn { text-align: center; font-weight: 700; }
  .btn.primary { background: var(--primary); color: var(--on); border-color: var(--primary); }
  select { width: 100%; padding: 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--glass); color: var(--ink); font: inherit; }
  #chosen { font-weight: 700; color: var(--ink); }
  #targets { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .target { border: 2px solid var(--line); background: var(--glass); color: var(--ink); border-radius: 6px; padding: 8px; font: inherit; text-align: left; }
  .target.on { border-color: var(--primary); }
  .target .thumb { width: 100%; aspect-ratio: 1; border-radius: 4px; background: var(--bg); object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 34px; color: var(--muted); }
  .target b { display: block; margin-top: 6px; font-size: 15px; }
  .target span { display: block; color: var(--muted); font-size: 13px; line-height: 1.3; }
  #refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  #refs a { display: block; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 1; }
  #refs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #refs h3 { grid-column: 1 / -1; margin: 6px 0 0; font-size: 15px; }
  .hint { font-size: 14px; margin-top: 8px; }
  .field { display: block; margin-bottom: 12px; }
  .field span { display: block; font-size: 15px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  input[type=date], input[type=text], textarea { width: 100%; padding: 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--glass); color: var(--ink); font: inherit; }
  textarea { resize: vertical; }
  #finish-box { margin-top: 30px; padding-top: 6px; border-top: 1px solid var(--line); }
  #f-queue { list-style: none; padding: 0; margin: 10px 0 14px; } #f-queue li { padding: 6px 0; font-size: 15px; word-break: break-all; }
  #f-queue li.ok { color: var(--ok); } #f-queue li.bad { color: var(--bad); }
  #f-msg.bad { color: var(--bad); } #f-msg.ok { color: var(--ok); font-weight: 700; }
  #queue { list-style: none; padding: 0; margin: 14px 0 0; }
  #queue li { padding: 8px 0; border-bottom: 1px solid var(--line); word-break: break-all; font-size: 15px; }
  #queue li.ok { color: var(--ok); } #queue li.bad { color: var(--bad); }
  input[type=file] { display: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .back { display: inline-flex; align-items: center; gap: 6px; margin: 18px 0 0; padding: 10px 14px 10px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--glass); color: var(--ink); font: inherit; font-weight: 700; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>ZeeBoard</h1>
  <p id="status"></p>

  <section id="list">
    <h2 id="t-commission"></h2>
    <div id="commissions"></div>
  </section>

  <section id="send" hidden>
    <button class="back" id="back"></button>
    <h2 id="t-sending"></h2>
    <p id="chosen"></p>
    <h2 id="t-stage"></h2>
    <select id="stage"></select>
    <div id="target-box" hidden>
      <h2 id="t-target"></h2>
      <div id="targets"></div>
    </div>
    <h2 id="t-photos"></h2>
    <label class="btn primary" id="pick"></label>
    <input id="files" type="file" accept="image/*" multiple>
    <ul id="queue"></ul>
    <div id="refs-box" hidden>
      <h2 id="t-refs"></h2>
      <div id="refs"></div>
      <p class="hint" id="t-refs-hint"></p>
    </div>

    <div id="finish-box">
      <h2 id="t-finish"></h2>
      <button class="btn" id="finish-open"></button>
      <div id="finish-form" hidden>
        <label class="field"><span id="t-date"></span><input type="date" id="f-date"></label>
        <label class="field"><span id="t-hours"></span><input type="text" id="f-hours" inputmode="decimal" placeholder="7,5" autocomplete="off"></label>
        <label class="field"><span id="t-fnotes"></span><textarea id="f-notes" rows="3"></textarea></label>
        <h2 id="t-final"></h2>
        <label class="btn" id="f-pick" for="f-files"></label>
        <input id="f-files" type="file" accept="image/*" multiple>
        <ul id="f-queue"></ul>
        <button class="btn primary" id="f-confirm"></button>
        <p class="hint" id="f-msg"></p>
      </div>
    </div>
  </section>
</main>

<script>
const es = { commission: "Elige la comisión", sending: "Enviando a", stage: "Etapa", target: "Añadir como", photos: "Imágenes", pick: "Elegir imágenes", back: "Cambiar de comisión", newAlt: "Nueva alternativa", newAltSub: "otra opción para el cliente", versionSub: (v) => "v" + v + " → v" + (v + 1), none: "No hay comisiones abiertas.", refs: "Referencias", refsHint: "Toca una para verla en grande y mantén pulsado para guardarla en Fotos.", offline: "No se pudo conectar con ZeeBoard. ¿Está abierto en el PC y con el interruptor activado?",
  finish: "Terminar", finishOpen: "Terminar esta comisión…", date: "Fecha de entrega", hours: "Horas dedicadas", fnotes: "Notas finales (enlace a la publicación, cómo fue…)", final: "Imagen final", pickFinal: "Elegir imagen final", confirm: "Marcar como terminada", hoursBad: "Escribe las horas como un número, por ejemplo 7,5", imagesFailed: "No se pudieron enviar las imágenes. Revisa la lista y vuelve a intentarlo.", finishFailed: "No se pudo terminar la comisión.", finished: "Comisión terminada", selected: (n) => n + (n === 1 ? " imagen lista para enviar" : " imágenes listas para enviar") };
const en = { commission: "Pick the commission", sending: "Sending to", stage: "Stage", target: "Add as", photos: "Images", pick: "Choose images", back: "Change commission", newAlt: "New alternative", newAltSub: "another option for the client", versionSub: (v) => "v" + v + " → v" + (v + 1), none: "No open commissions.", refs: "References", refsHint: "Tap one to see it full size, then press and hold to save it to Photos.", offline: "Could not reach ZeeBoard. Is it open on the PC with the switch on?",
  finish: "Finish", finishOpen: "Finish this commission…", date: "Delivery date", hours: "Hours spent", fnotes: "Final notes (link to the post, how it went…)", final: "Final image", pickFinal: "Choose final image", confirm: "Mark as finished", hoursBad: "Enter the hours as a number, like 7.5", imagesFailed: "The images could not be sent. Check the list and try again.", finishFailed: "Could not finish the commission.", finished: "Commission finished", selected: (n) => n + (n === 1 ? " image ready to send" : " images ready to send") };
const spanish = navigator.language.toLowerCase().startsWith("es");
const L = spanish ? es : en;
document.documentElement.lang = spanish ? "es" : "en";

const $ = (id) => document.getElementById(id);
const key = new URLSearchParams(location.search).get("k") || "";
let data = { commissions: [] };
let chosen = null;
// null = a new alternative; a number = a new version of that alternative of the stage
let target = null;
// Finished from this page: hidden at once, before the app refreshes the list
const finishedHere = new Set();
let finalFiles = [];

$("t-commission").textContent = L.commission;
$("t-sending").textContent = L.sending;
$("t-stage").textContent = L.stage;
$("t-target").textContent = L.target;
$("t-photos").textContent = L.photos;
$("pick").textContent = L.pick;
$("pick").htmlFor = "files";
$("back").textContent = "‹ " + L.back;
$("t-refs").textContent = L.refs;
$("t-refs-hint").textContent = L.refsHint;
$("t-finish").textContent = L.finish;
$("finish-open").textContent = L.finishOpen;
$("t-date").textContent = L.date;
$("t-hours").textContent = L.hours;
$("t-fnotes").textContent = L.fnotes;
$("t-final").textContent = L.final;
$("f-pick").textContent = L.pickFinal;
$("f-confirm").textContent = L.confirm;

async function fetchData() {
  const response = await fetch("/api/commissions?k=" + encodeURIComponent(key), { cache: "no-store" });
  if (!response.ok) throw new Error(response.status);
  data = await response.json();
}

async function load() {
  try {
    await fetchData();
    $("status").textContent = "";
    renderList();
  } catch (error) {
    $("status").textContent = L.offline;
  }
}

function renderList() {
  const box = $("commissions");
  box.innerHTML = "";
  const open = data.commissions.filter((commission) => !finishedHere.has(commission.id));
  if (!open.length) { box.textContent = L.none; return; }
  for (const commission of open) {
    const button = document.createElement("button");
    button.className = "item";
    const title = document.createElement("b");
    const client = document.createElement("span");
    title.textContent = commission.title;
    client.textContent = commission.client || "";
    button.append(title, client);
    button.onclick = () => choose(commission);
    box.appendChild(button);
  }
}

function choose(commission) {
  chosen = commission;
  target = null;
  if (!history.state) history.pushState({ send: true }, "");
  $("list").hidden = true;
  $("send").hidden = false;
  $("chosen").textContent = commission.title + (commission.client ? " · " + commission.client : "");
  const select = $("stage");
  select.innerHTML = "";
  for (const stage of commission.stages) {
    const option = document.createElement("option");
    option.value = stage.id;
    option.textContent = stage.name;
    option.selected = stage.id === commission.currentStageId;
    select.appendChild(option);
  }
  renderTargets();
  renderRefs();
  resetFinish();
}

function today() {
  const now = new Date();
  const two = (n) => String(n).padStart(2, "0");
  return now.getFullYear() + "-" + two(now.getMonth() + 1) + "-" + two(now.getDate());
}

function resetFinish() {
  finalFiles = [];
  $("finish-form").hidden = true;
  $("f-date").value = today();
  $("f-hours").value = "";
  $("f-notes").value = "";
  $("f-queue").innerHTML = "";
  $("f-msg").textContent = "";
  $("f-confirm").disabled = false;
  renderFinalFiles();
}

function say(text, kind) {
  const message = $("f-msg");
  message.textContent = text;
  message.className = "hint" + (kind ? " " + kind : "");
}

function renderFinalFiles() {
  $("f-queue").innerHTML = "";
  if (!finalFiles.length) return;
  const row = document.createElement("li");
  row.textContent = L.selected(finalFiles.length);
  $("f-queue").appendChild(row);
}

// The characters' references, full size on tap (to save them to Photos)
function renderRefs() {
  const refs = chosen.refs || [];
  const box = $("refs");
  box.innerHTML = "";
  $("refs-box").hidden = refs.length === 0;
  let character = null;
  for (const ref of refs) {
    if (ref.character !== character) {
      character = ref.character;
      const name = document.createElement("h3");
      name.textContent = character;
      box.appendChild(name);
    }
    const link = document.createElement("a");
    link.href = "/image?k=" + encodeURIComponent(key) + "&p=" + ref.image;
    link.target = "_blank";
    const picture = document.createElement("img");
    picture.src = "/thumb?k=" + encodeURIComponent(key) + "&p=" + ref.thumb;
    picture.alt = ref.label || character;
    picture.loading = "lazy";
    link.appendChild(picture);
    box.appendChild(link);
  }
}

// What the images of this stage can be added to: a new alternative, or a new version of an existing one
function renderTargets() {
  const stage = chosen.stages.find((item) => String(item.id) === $("stage").value);
  const alts = (stage && stage.alts) || [];
  const box = $("targets");
  box.innerHTML = "";
  $("target-box").hidden = alts.length === 0;
  if (!alts.some((alt) => alt.alt === target)) target = null;

  const card = (alt, title, subtitle, thumb) => {
    const button = document.createElement("button");
    button.className = "target" + (alt === target ? " on" : "");
    let picture;
    if (thumb) {
      picture = document.createElement("img");
      picture.src = "/thumb?k=" + encodeURIComponent(key) + "&p=" + thumb;
      picture.alt = "";
    } else {
      picture = document.createElement("div");
      picture.textContent = alt === null ? "+" : "▢";
    }
    picture.className = "thumb";
    const name = document.createElement("b");
    const sub = document.createElement("span");
    name.textContent = title;
    sub.textContent = subtitle;
    button.append(picture, name, sub);
    button.onclick = () => { target = alt; renderTargets(); };
    box.appendChild(button);
  };

  card(null, L.newAlt, L.newAltSub, null);
  for (const alt of alts) card(alt.alt, alt.label, L.versionSub(alt.version), alt.thumb);
}

$("stage").onchange = renderTargets;
// Going back (this button, the swipe or the browser's back) returns to the list instead of leaving the page
function showList() { $("send").hidden = true; $("list").hidden = false; $("queue").innerHTML = ""; load(); }
$("back").onclick = () => (history.state ? history.back() : showList());
window.onpopstate = showList;

$("files").onchange = async (event) => {
  const files = [...event.target.files];
  event.target.value = "";
  for (const file of files) await upload(file);
};

// After a send the list changes (new thumbnail and version): read it again, keeping the stage and the choice
async function refreshAfterSend() {
  try {
    await fetchData();
    const fresh = data.commissions.find((commission) => commission.id === chosen.id);
    if (fresh) { chosen = fresh; renderTargets(); }
  } catch (error) { /* the next send shows the problem */ }
}

// One at a time: a big canvas is already a lot to hold in memory
// `opts.stage` and `opts.list` send the final images of a commission to its last stage, as new alternatives, listed apart.
// Resolves to whether it arrived.
function upload(file, opts = {}) {
  return new Promise((resolve) => {
    const row = document.createElement("li");
    row.textContent = file.name + " · 0 %";
    (opts.list || $("queue")).prepend(row);

    const final = opts.stage !== undefined;
    const request = new XMLHttpRequest();
    request.open("POST", "/upload?k=" + encodeURIComponent(key) + "&commission=" + chosen.id + "&stage=" + (final ? opts.stage : $("stage").value) + (final || target === null ? "" : "&alt=" + target));
    request.upload.onprogress = (event) => {
      if (event.lengthComputable) row.textContent = file.name + " · " + Math.round((event.loaded / event.total) * 100) + " %";
    };
    request.onload = () => {
      const ok = request.status === 200;
      row.textContent = (ok ? "✓ " : "✗ ") + file.name + (ok ? "" : " · " + (request.responseText || request.status));
      row.className = ok ? "ok" : "bad";
      if (ok && !final) setTimeout(refreshAfterSend, 1500);
      resolve(ok);
    };
    request.onerror = () => { row.textContent = "✗ " + file.name + " · " + L.offline; row.className = "bad"; resolve(false); };
    request.send(file);
  });
}

$("finish-open").onclick = () => { $("finish-form").hidden = !$("finish-form").hidden; };
["f-date", "f-hours", "f-notes"].forEach((id) => { $(id).oninput = () => say(""); });
$("f-files").onchange = (event) => {
  finalFiles.push(...event.target.files);
  event.target.value = "";
  renderFinalFiles();
};

$("f-confirm").onclick = async () => {
  const text = $("f-hours").value.trim().replace(",", ".");
  const hours = text === "" ? null : Number(text);
  if (hours !== null && (!Number.isFinite(hours) || hours < 0)) return say(L.hoursBad, "bad");
  if (!$("f-date").value) return;

  const button = $("f-confirm");
  button.disabled = true;
  say("");
  $("f-queue").innerHTML = "";

  // The images go first: if one fails nothing is finished and it can be retried
  if (finalFiles.length && chosen.lastStageId == null) { button.disabled = false; return say(L.finishFailed, "bad"); }
  for (const file of [...finalFiles]) {
    if (!(await upload(file, { stage: chosen.lastStageId, list: $("f-queue") }))) { button.disabled = false; return say(L.imagesFailed, "bad"); }
    finalFiles = finalFiles.filter((item) => item !== file); // already sent: not sent twice on a retry
  }

  let response = null;
  try {
    response = await fetch("/finish?k=" + encodeURIComponent(key), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ commission: chosen.id, deliveredAt: $("f-date").value, hours, notes: $("f-notes").value }),
    });
  } catch (error) { /* offline */ }

  if (response && response.ok) {
    finishedHere.add(chosen.id);
    say("✓ " + L.finished, "ok");
    setTimeout(() => (history.state ? history.back() : showList()), 1600);
  } else {
    button.disabled = false;
    say(L.finishFailed + (response ? " · " + (await response.text()) : " " + L.offline), "bad");
  }
};

load();
</script>
</body>
</html>
